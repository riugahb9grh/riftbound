name: Update Riftbound prices

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices and append snapshot
        run: python scripts/update_prices.py

      - name: Commit changed data
        run: |
          git config user.name "riftbound-movers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json data/movers.json
          git diff --cached --quiet || git commit -m "Update Riftbound prices"
          git push
