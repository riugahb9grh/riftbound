<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#121118" />
  <meta name="description" content="Track the biggest Riftbound card price movers from TCGplayer market data." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Riftbound Movers</title>
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">TCGPLAYER MARKET WATCH</p>
      <h1>Riftbound Movers</h1>
    </div>
    <button id="installButton" class="install-button" hidden>Install</button>
  </header>

  <main>
    <section class="controls" aria-label="Price filters">
      <label>
        Window
        <select id="windowSelect">
          <option value="1">24 hours</option>
          <option value="3">3 days</option>
          <option value="7" selected>7 days</option>
          <option value="14">14 days</option>
          <option value="30">30 days</option>
          <option value="90">90 days</option>
        </select>
      </label>

      <label>
        Sort
        <select id="sortSelect">
          <option value="percent-desc">Biggest % gain</option>
          <option value="dollar-desc">Biggest $ gain</option>
          <option value="percent-asc">Biggest % loss</option>
          <option value="dollar-asc">Biggest $ loss</option>
          <option value="price-desc">Highest price</option>
        </select>
      </label>

      <label>
        Printing
        <select id="printingSelect">
          <option value="all">All</option>
        </select>
      </label>

      <label class="search-label">
        Search
        <input id="searchInput" type="search" placeholder="Card name…" autocomplete="off" />
      </label>
    </section>

    <section class="summary" aria-live="polite">
      <div>
        <span class="summary-label">Updated</span>
        <strong id="updatedAt">Loading…</strong>
      </div>
      <div>
        <span class="summary-label">Cards shown</span>
        <strong id="cardCount">–</strong>
      </div>
      <div>
        <span class="summary-label">Data window</span>
        <strong id="actualWindow">–</strong>
      </div>
    </section>

    <div id="status" class="status">Loading market data…</div>
    <section id="cardList" class="card-list" aria-label="Price movers"></section>
  </main>

  <template id="cardTemplate">
    <article class="mover-card">
      <a class="card-link" target="_blank" rel="noopener noreferrer">
        <div class="card-image-wrap">
          <img class="card-image" loading="lazy" alt="" />
          <div class="image-fallback">RB</div>
        </div>
        <div class="card-body">
          <div class="card-heading">
            <div>
              <h2 class="card-name"></h2>
              <p class="card-meta"></p>
            </div>
            <span class="change-pill"></span>
          </div>
          <div class="price-row">
            <div>
              <span class="price-label">Then</span>
              <strong class="old-price"></strong>
            </div>
            <span class="arrow">→</span>
            <div>
              <span class="price-label">Now</span>
              <strong class="new-price"></strong>
            </div>
            <div class="dollar-change-box">
              <span class="price-label">Change</span>
              <strong class="dollar-change"></strong>
            </div>
          </div>
        </div>
      </a>
    </article>
  </template>

  <script src="./app.js" type="module"></script>
</body>
</html>
